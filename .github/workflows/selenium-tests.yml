name: Selenium Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  selenium:
    name: Web automation suite
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium tests in headless mode
        run: >
          mvn -B clean test
          -Dheadless=true
          -Dbrowser=chrome
          -DbaseUrl=https://demowebshop.tricentis.com

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-allure-results
          path: |
            target/surefire-reports
            target/allure-results
          retention-days: 14
